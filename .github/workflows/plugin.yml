name: plugin

on:
  push:
    paths: ["index.mjs", "opencode.mjs", "opencode2.mjs", "plugin/**", "gateway/**", "bin/**", "test/**", "package.json", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["index.mjs", "opencode.mjs", "opencode2.mjs", "plugin/**", "gateway/**", "bin/**", "test/**", "package.json", ".github/workflows/plugin.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test
